trigger: none

pr: none

resources:
  webhooks:
    - webhook: BugUpdateWebHook
      connection: IncomingWebhookConnection

pool:
  vmImage: ubuntu-latest

steps:

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'
    addToPath: true
  displayName: 'Setup Python'

- bash: |
    pip install requests -q
  displayName: 'Install Python Dependencies'

- bash: |
    set -e
    
    # Extract parameters from webhook
    BUG_ID="${{ parameters.BugUpdateWebHook.resource.workItemId }}"
    REPRO_STEPS='${{ parameters.BugUpdateWebHook.resource.revision.fields['Microsoft.VSTS.TCM.ReproSteps'] }}'
    
    # Export as environment variables for Python script
    export BUG_ID="$BUG_ID"
    export REPRO_STEPS="$REPRO_STEPS"
    export SYSTEM_ACCESSTOKEN="$SYSTEM_ACCESSTOKEN"
    
    # Run Python script
    python $(Build.SourcesDirectory)/analyze_bug.py
    
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  
  displayName: 'Analyze Bug with DevToolBox AI'
