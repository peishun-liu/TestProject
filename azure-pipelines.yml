trigger: none

pr: none

resources:
  webhooks:
    - webhook: BugUpdateWebHook
      connection: IncomingWebhookConnection

pool:
  vmImage: ubuntu-latest

steps:

- bash: |
    set -e

    BUG_ID="${{ parameters.BugUpdateWebHook.resource.workItemId }}"
    REPRO_STEPS='${{ parameters.BugUpdateWebHook.resource.revision.fields['Microsoft.VSTS.TCM.ReproSteps'] }}'

    echo "========================================"
    echo "Bug ID"
    echo "========================================"
    echo "$BUG_ID"

    echo "========================================"
    echo "Repro Steps"
    echo "========================================"
    echo "$REPRO_STEPS"

    CLEAN_TEXT=$(printf '%s' "$REPRO_STEPS" | sed 's/<[^>]*>/ /g')

    echo "========================================"
    echo "Clean Repro Steps"
    echo "========================================"
    echo "$CLEAN_TEXT"

    REQUEST=$(jq -n \
      --arg prompt "あなたはプロフェッショナルなソフトウェアエンジニアです。

      以下のAzure DevOps Bugを分析してください。

      Bug ID：
      $BUG_ID

      Repro Steps：
      $CLEAN_TEXT

      Repro Stepsの中に中国語が含まれているか判定してください。

      重要なルール：
      - chinese_textには、必ず「Repro Stepsに実際に存在する文字列」だけを記載してください。
      - 絶対に以下のことをしてはいけません。
        1. Repro Stepsに存在しない文字列を生成しないでください。
        2. 中国語を翻訳しないでください。
        3. 中国語を言い換えないでください。
        4. 中国語を要約しないでください。
        5. 「中国語」「中文」「Chinese」などの説明用の文字列を追加しないでください。
        6. Repro Stepsに存在しない文字列を推測して追加しないでください。
        7. AI自身が考えた中国語を追加しないでください。

      抽出方法
      - Repro Stepsを最初から最後まで確認してください。
      - 中国語と思われる文字列を見つけた場合、その文字列をRepro Stepsからそのままコピーしてください。

      以下のJSON形式で必ず回答してください。

      {
        \"summary\": \"Bugの概要\",
        \"language\": \"Repro Stepsの主要な言語\",
        \"has_chinese\": false,
        \"chinese_text\": [],
        \"is_repro_steps_clear\": true,
        \"missing_information\": [],
        \"suggested_action\": \"none\"
      }

      回答ルール：
      - has_chineseは必ずtrueまたはfalseにしてください。
      - has_chineseがtrueの場合、chinese_textに検出した中国語を記載してください。
      - has_chineseがfalseの場合、chinese_textは必ず空の配列にしてください。
      - is_repro_steps_clearは必ずtrueまたはfalseにしてください。
      - missing_informationは文字列の配列にしてください。
      - JSONのキーは英語のままにしてください。
      - JSONの値は日本語で記述してください。
      - Markdownは使用しないでください。
      - コードブロックは使用しないでください。
      - JSONのみを返してください。
      - JSON以外の説明は一切追加しないでください。" \
        '{
          prompt: $prompt,
          max_tokens: 500
        }'
    )

    echo "========================================"
    echo "Request"
    echo "========================================"
    echo "$REQUEST"

    echo "========================================"
    echo "Calling DevToolBox AI"
    echo "========================================"

    curl --fail-with-body \
      -sS \
      -X POST \
      "https://devtoolbox-api.devtoolbox-api.workers.dev/ai/generate" \
      -H "Content-Type: application/json" \
      -d "$REQUEST" \
      -o ai-response.json

    echo "========================================"
    echo "AI Response"
    echo "========================================"
    cat ai-response.json

  displayName: 'Analyze Bug with DevToolBox AI'