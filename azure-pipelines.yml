trigger: none

pr: none

resources:
  webhooks:
    - webhook: BugUpdateWebHook
      connection: IncomingWebhookConnection

pool:
  vmImage: ubuntu-latest

steps:

- bash: |
    set -e

    BUG_ID="${{ parameters.BugUpdateWebHook.resource.workItemId }}"
    REPRO_STEPS='${{ parameters.BugUpdateWebHook.resource.revision.fields['Microsoft.VSTS.TCM.ReproSteps'] }}'

    echo "========================================"
    echo "Bug ID"
    echo "========================================"
    echo "$BUG_ID"

    echo "========================================"
    echo "Repro Steps"
    echo "========================================"
    echo "$REPRO_STEPS"

    CLEAN_TEXT=$(printf '%s' "$REPRO_STEPS" | sed 's/<[^>]*>/ /g')

    echo "========================================"
    echo "Clean Repro Steps"
    echo "========================================"
    echo "$CLEAN_TEXT"

    REQUEST=$(jq -n \
      --arg prompt "あなたはプロフェッショナルなソフトウェアエンジニアです。
          以下のAzure DevOps Bugを分析してください。
          Repro Stepsの中に中国語が含まれているか判定してください。

          Bug ID: $BUG_ID
          Repro Steps:
          $CLEAN_TEXT
          
          すべての回答を日本語で返してください。

          以下のJSON形式で返してください。

          {
            \"summary\": \"バグの概要\",
            \"language\": \"Repro Stepsの言語\",
            \"is_chinese\": false,
            \"is_repro_steps_clear\": true,
            \"missing_information\": [],
            \"suggested_action\": \"none\"
          }

          ルール：
          - JSONのキーは英語のままにしてください。
          - JSONの値は日本語で記述してください。
          - 中国語が含まれている場合は is_chinese を true にしてください。
          - 中国語が含まれていない場合は is_chinese を false にしてください。
          - 日本語に含まれる漢字だけでは中国語と判定しないでください。
          - summaryはバグの概要を簡潔に記述してください。
          - languageにはRepro Stepsの言語を記述してください。
          - is_repro_steps_clearはtrueまたはfalseにしてください。
          - missing_informationは文字列の配列にしてください。
          - suggested_actionは推奨アクションを記述してください。
          - Markdownを使用しないでください。
          - コードブロックを使用しないでください。
          - JSONのみを返してください。
          - 回答は簡潔にしてください。" \
            '{
              prompt: $prompt,
              max_tokens: 500
            }'
        )

    echo "========================================"
    echo "Request"
    echo "========================================"
    echo "$REQUEST"

    echo "========================================"
    echo "Calling DevToolBox AI"
    echo "========================================"

    curl --fail-with-body \
      -sS \
      -X POST \
      "https://devtoolbox-api.devtoolbox-api.workers.dev/ai/generate" \
      -H "Content-Type: application/json" \
      -d "$REQUEST" \
      -o ai-response.json

    echo "========================================"
    echo "AI Response"
    echo "========================================"
    cat ai-response.json

  displayName: 'Analyze Bug with DevToolBox AI'