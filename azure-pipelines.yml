# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger: none

resources:
  webhooks:
    - webhook: BugUpdateWebHook
      connection: IncomingWebhookConnection

parameters:
  - name : BugUpdateWebHook
    type: object
    default: {}

pool:
  vmImage: ubuntu-latest

steps:
- bash: |
    echo "Bug ID:"
    echo "${{ parameters.BugUpdateWebHook.resource.workItemId }}"

    echo "Repro Steps:"
    echo "${{ parameters.BugUpdateWebHook.resource.revision.fields['Microsoft.VSTS.TCM.ReproSteps'] }}"
  displayName: 'Get Bug Repro Steps'

- script: |
    echo Add other tasks to build, test, and deploy your project.
    echo See https://aka.ms/yaml
  displayName: 'Run a multi-line script'
