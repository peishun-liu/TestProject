trigger: none

pr: none

resources:
  webhooks:
    - webhook: BugUpdateWebHook
      connection: IncomingWebhookConnection

pool:
  vmImage: ubuntu-latest

steps:

- bash: |
    set -e

    BUG_ID="${{ parameters.BugUpdateWebHook.resource.workItemId }}"
    REPRO_STEPS='${{ parameters.BugUpdateWebHook.resource.revision.fields['Microsoft.VSTS.TCM.ReproSteps'] }}'

    echo "========================================"
    echo "Bug ID"
    echo "========================================"
    echo "$BUG_ID"

    echo "========================================"
    echo "Repro Steps"
    echo "========================================"
    echo "$REPRO_STEPS"

    CLEAN_TEXT=$(printf '%s' "$REPRO_STEPS" | sed 's/<[^>]*>/ /g')

    echo "========================================"
    echo "Clean Repro Steps"
    echo "========================================"
    echo "$CLEAN_TEXT"

    REQUEST=$(jq -n \
      --arg prompt "你是一名精通日语和各种开发语言的软件领域的专家。
          请判断 Repro Steps 中是否包含中文内容。
          Bug ID: $BUG_ID
          Repro Steps:
          $CLEAN_TEXT
          
          
          特别注意：
          - 只要 Repro Steps 中出现中文词语或中文句子，就将 is_chinese 设置为 true。
          - 日文中的汉字不能单独作为中文判断依据。
          - 如果同时存在日文和中文，只要存在中文，就设置为 true。

          请严格按照以下 JSON 格式返回：

          {
            \"summary\": \"Bug的简短概要\",
            \"language\": \"Repro Steps的主要语言\",
            \"is_chinese\": false,
            \"is_repro_steps_clear\": true,
            \"missing_information\": [],
            \"suggested_action\": \"none\"
          }


          要求：
          - is_chinese 必须是 true 或 false。
          - is_repro_steps_clear 必须是 true 或 false。
          - missing_information 必须是字符串数组。
          - JSON 的 key 必须保持英文。
          - 不要返回 Markdown。
          - 不要返回代码块。
          - 只返回 JSON。
          - 不要添加任何额外说明。" \
            '{
              prompt: $prompt,
              max_tokens: 500
            }'
        )

    echo "========================================"
    echo "Request"
    echo "========================================"
    echo "$REQUEST"

    echo "========================================"
    echo "Calling DevToolBox AI"
    echo "========================================"

    curl --fail-with-body \
      -sS \
      -X POST \
      "https://devtoolbox-api.devtoolbox-api.workers.dev/ai/generate" \
      -H "Content-Type: application/json" \
      -d "$REQUEST" \
      -o ai-response.json

    echo "========================================"
    echo "AI Response"
    echo "========================================"
    cat ai-response.json

  displayName: 'Analyze Bug with DevToolBox AI'