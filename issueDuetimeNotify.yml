trigger: none # 禁用代码提交触发，完全交由 Webhook 触发

# 核心：绑定第一步创建的专属 Service Connection
resources:
  webhooks:
    - webhook: issueCreate
      connection: IssueConn # 必须与第一步的名字完全一致

pool:
  vmImage: 'ubuntu-latest' # 使用轻量 Linux 极速开机

steps:
- bash: |
    set -e
    # 1. 解析 Webhook 传过来的 Issue ID
    ISSUE_ID="${{ parameters.issueCreate.resource.workItemId }}"
    echo "当前处理的 Issue ID: ${ISSUE_ID}"

    echo "====== 【全量字段 JSON 报文开始】 ======"
    echo '${{ convertToJson(parameters.issueCreate.resource.revision.fields) }}'
    echo "====== 【全量字段 JSON 报文结束】 ======"

    # 2. 兼容解析 Priority（优先级）的值
    PRIORITY='${{ parameters.issueCreate.resource.revision.fields['Microsoft.VSTS.Common.Priority'] }}'
    echo "检测到当前的优先级为: ${PRIORITY}"

    # 3. 获取 Issue 的创建日期 (格式通常是 2026-03-31T08:30:00Z)
    CREATED_DATE_STR="${{parameters.issueCreate.resource.fields['System.CreatedDate']}}"
    echo "该 Issue 的原始创建日期为: ${CREATED_DATE_STR}"
  displayName: 'Analyze Issue with DevToolBox AI'
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
