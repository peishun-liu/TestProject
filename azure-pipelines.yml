trigger: none

pr: none

resources:
  webhooks:
    - webhook: BugUpdateWebHook
      connection: IncomingWebhookConnection

pool:
  vmImage: ubuntu-latest

steps:

- bash: |
    set -e

    BUG_ID="${{ parameters.BugUpdateWebHook.resource.workItemId }}"
    REPRO_STEPS='${{ parameters.BugUpdateWebHook.resource.revision.fields['Microsoft.VSTS.TCM.ReproSteps'] }}'

    echo "========================================"
    echo "Bug ID"
    echo "========================================"
    echo "$BUG_ID"

    echo "========================================"
    echo "Repro Steps"
    echo "========================================"
    echo "$REPRO_STEPS"

    CLEAN_TEXT=$(printf '%s' "$REPRO_STEPS" | sed 's/<[^>]*>/ /g')

    echo "========================================"
    echo "Clean Repro Steps"
    echo "========================================"
    echo "$CLEAN_TEXT"

    REQUEST=$(jq -n \
      --arg prompt "You are a professional software QA engineer.
          Analyze this Azure DevOps Bug.
          Bug ID: $BUG_ID
          Repro Steps:
          $CLEAN_TEXT
          
          Please provide:
          1. A short summary of the bug
          2. The language of the Repro Steps
          3. Whether the Repro Steps are clear enough
          4. Missing information
          5. Suggested next action
          
          Keep the response concise." \
          --argjson max_tokens 500 \
          '{
            prompt: $prompt,
            max_tokens: $max_tokens
            }'
          )

          The response MUST use exactly this structure:
          {
            \"summary\": \"short summary of the bug\",
            \"language\": \"language of the Repro Steps\",
            \"is_repro_steps_clear\": true,
            \"missing_information\": [],
            \"suggested_action\": \"none\"
          }

          Rules:
          - summary must be a short description of the bug
          - language should be the language used in Repro Steps
          - is_repro_steps_clear must be true or false
          - missing_information must be an array of strings
          - suggested_action must be a short action identifier
          - Do not return Markdown
          - Do not return code fences
          - Return JSON only." \
            '{
              prompt: $prompt,
              max_tokens: 500
            }'
          )

    echo "========================================"
    echo "Request"
    echo "========================================"
    echo "$REQUEST"

    echo "========================================"
    echo "Calling DevToolBox AI"
    echo "========================================"

    curl --fail-with-body \
      -sS \
      -X POST \
      "https://devtoolbox-api.devtoolbox-api.workers.dev/ai/generate" \
      -H "Content-Type: application/json" \
      -d "$REQUEST" \
      -o ai-response.json

    echo "========================================"
    echo "AI Response"
    echo "========================================"
    cat ai-response.json

  displayName: 'Analyze Bug with DevToolBox AI'